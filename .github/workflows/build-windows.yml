name: Build Windows EXE

# Builds NashDownloader.exe on a Windows runner in the cloud —
# no Windows machine needed on your end.
# After this runs, go to the Actions tab -> this run -> Artifacts ->
# download "NashDownloader-windows". It contains the ready-to-share .exe.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download ffmpeg (static Windows build)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg_bin | Out-Null

          # Use GitHub-hosted FFmpeg builds instead of gyan.dev — GitHub's CDN
          # is far more reliable than gyan.dev, which occasionally returns
          # 503 Service Unavailable under load.
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"

          # Retry up to 5 times with backoff, in case of any transient network/host issue
          $maxAttempts = 5
          $success = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              Write-Output "Attempt $i of $maxAttempts : downloading FFmpeg..."
              Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip -TimeoutSec 120
              $success = $true
              break
            } catch {
              Write-Warning "Download failed: $($_.Exception.Message)"
              if ($i -lt $maxAttempts) {
                $waitSeconds = 10 * $i
                Write-Output "Retrying in $waitSeconds seconds..."
                Start-Sleep -Seconds $waitSeconds
              }
            }
          }
          if (-Not $success) {
            Write-Error "Failed to download FFmpeg after $maxAttempts attempts."
            exit 1
          }

          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $bin = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $dir = Split-Path $bin.FullName
          Copy-Item "$dir\ffmpeg.exe" ffmpeg_bin\ffmpeg.exe
          Copy-Item "$dir\ffprobe.exe" ffmpeg_bin\ffprobe.exe
          Write-Output "✓ FFmpeg ready"

      - name: Check files before build
        run: |
          dir
          if (-Not (Test-Path "logo.png")) {
            Write-Error "logo.png not found!"
            exit 1
          }
          Write-Output "✓ All required files found"

      - name: Convert logo.png to .ico for the exe icon
        run: |
          pip install pillow
          python -c "from PIL import Image; img = Image.open('logo.png'); img.save('logo.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "NashDownloader" `
            --icon "logo.ico" `
            --add-data "index.html:." `
            --add-data "logo.png:." `
            --add-binary "ffmpeg_bin\ffmpeg.exe:ffmpeg_bin" `
            --add-binary "ffmpeg_bin\ffprobe.exe:ffmpeg_bin" `
            app.py

      - name: Upload built exe
        uses: actions/upload-artifact@v4
        with:
          name: NashDownloader-windows
          path: dist/NashDownloader.exe
